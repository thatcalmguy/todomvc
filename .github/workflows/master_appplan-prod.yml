# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - appplan-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Set up Node.js version
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'  # Node 18 is LTS and stable for most npm packages

      # Step 3: Install dependencies safely
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-optional

      # Step 4: Build (if applicable)
      - name: Build project
        run: npm run build --if-present

      # Step 5: Run tests (optional)
      - name: Run tests
        run: npm run test --if-present

      # Step 6: Upload build artifact
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      # Step 7: Download artifact from build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      # Step 8: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'appplan-prod'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6A26232382A04A04973CF4606C32BAD1 }}
          package: .
