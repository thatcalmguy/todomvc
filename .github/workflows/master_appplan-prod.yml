name: Build and deploy Node.js app to Azure Web App - appplan-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # Step 3: Clean deprecated packages
      - name: Remove deprecated packages
        run: |
          npm uninstall phantomjs phantomjs-prebuilt || true
          npm uninstall uncss || true

      # Step 4: Install dependencies safely
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-optional

      # Step 5: Build project (skipped if not needed)
      - name: Build project
        run: echo "No build step needed"

      # Step 6: Run tests (optional)
      - name: Run tests
        run: npm run test --if-present

      # Step 7: Upload artifact for deployment job
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      # Step 8: Download artifact from build job
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      # Step 9: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'appplan-prod'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6A26232382A04A04973CF4606C32BAD1 }}
          package: .
